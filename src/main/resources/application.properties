spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# JPA / Hibernate
spring.jpa.show-sql=false
# Tránh auto alter schema gây lỗi FK "incompatible" trên DB hiện có.
spring.jpa.hibernate.ddl-auto=none
