spring.application.name=resort-management
server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/resort_management?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

spring.jackson.serialization.fail-on-empty-beans=false

jwt.secret=resort_management_super_secret_key_2024_must_be_at_least_256_bits_long
jwt.expiration=86400000