spring.application.name=resort-management

# Server
server.port=8080

# MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/resort_management?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=123456789
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.show-sql=true
# Tránh auto alter schema gây lỗi FK "incompatible" trên DB hiện có.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Jackson - xử lý vòng lặp JSON
spring.jackson.serialization.fail-on-empty-beans=false
