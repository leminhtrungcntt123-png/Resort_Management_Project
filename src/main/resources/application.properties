spring.application.name=resort-management

# Server
server.port=8080

# MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/resort_management?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=admin
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Jackson - xử lý vòng lặp JSON
spring.jackson.serialization.fail-on-empty-beans=false
