<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thanh Toán Thành Công | AURA RESORT</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg: #0b1121;
            --cyan: #00f2fe;
            --emerald: #34d399;
        }
        body {
            margin: 0; padding: 0;
            background: var(--bg);
            color: white;
            font-family: 'Poppins', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        .success-card {
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 50px;
            border-radius: 30px;
            text-align: center;
            max-width: 500px;
            width: 90%;
            box-shadow: 0 30px 60px rgba(0,0,0,0.5);
            animation: cardPop 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .check-icon {
            width: 100px; height: 100px;
            background: var(--emerald);
            color: #0b1121;
            font-size: 50px;
            line-height: 100px;
            border-radius: 50%;
            margin: 0 auto 30px;
            box-shadow: 0 0 30px var(--emerald);
            animation: pulseIcon 2s infinite;
        }
        h1 { font-size: 2rem; margin-bottom: 10px; background: linear-gradient(to right, #fff, var(--cyan)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        p { color: rgba(255,255,255,0.6); margin-bottom: 30px; }
        .tx-info {
            background: rgba(0,0,0,0.3);
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 35px;
            text-align: left;
            font-size: 0.9rem;
        }
        .tx-row { display: flex; justify-content: space-between; margin-bottom: 8px; }
        .btn-home {
            display: inline-block;
            padding: 15px 40px;
            background: white;
            color: #0b1121;
            text-decoration: none;
            border-radius: 50px;
            font-weight: 600;
            transition: 0.3s;
        }
        .btn-home:hover { transform: scale(1.05); box-shadow: 0 10px 20px rgba(255,255,255,0.2); }
        
        @keyframes cardPop { from { opacity: 0; transform: scale(0.8); } to { opacity: 1; transform: scale(1); } }
        @keyframes pulseIcon { 0% { box-shadow: 0 0 0 0 rgba(52, 211, 153, 0.7); } 70% { box-shadow: 0 0 0 20px rgba(52, 211, 153, 0); } 100% { box-shadow: 0 0 0 0 rgba(52, 211, 153, 0); } }
    </style>
</head>
<body>
    <div class="success-card">
        <div class="check-icon"><i class="fas fa-check"></i></div>
        <h1>Thanh toán thành công</h1>
        <p>Giao dịch của bạn đã được hệ thống Aura xác nhận.</p>
        
        <div class="tx-info">
            <div class="tx-row"><span>Mã giao dịch:</span> <strong id="tx-code" style="color:var(--cyan)">-</strong></div>
            <div class="tx-row"><span>Thời gian:</span> <strong id="tx-time">-</strong></div>
            <div class="tx-row"><span>Phương thức:</span> <strong>Chuyển khoản QR</strong></div>
        </div>

        <a href="index.html" class="btn-home">Quay về Trang chủ</a>
    </div>

    <script>
        // Hiệu ứng âm thanh ting
        const audio = new Audio('https://assets.mixkit.co/active_storage/sfx/2013/2013-preview.mp3');
        window.onload = () => {
            audio.play().catch(() => console.log("User interaction required for audio"));
            document.getElementById('tx-code').innerText = sessionStorage.getItem('last_tx') || 'TX-9928374';
            document.getElementById('tx-time').innerText = new Date().toLocaleString('vi-VN');
        }
    </script>
</body>
</html>
